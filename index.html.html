<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình xử lý bảng chấm công OT Misa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS for Excel processing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
          const [rawWorkbook, setRawWorkbook] = useState(null);
          const [rawSheets, setRawSheets] = useState([]);
          const [selectedSheet, setSelectedSheet] = useState('');
          const [rawData, setRawData] = useState([]);
          const [xlsxLoaded, setXlsxLoaded] = useState(false);
          
          const [settings, setSettings] = useState({
            startRow: 15,
            empIdCol: 1,
            empNameCol: 2,
            titleCol: 3,
            otStartCol: 4,
            otEndCol: 34,
            periodStartDate: '2026-08-29',
            weekdayStartTime: '17:30',
            sundayStartTime: '08:00',
            overtimeType: 'Sau ca',
            reason: 'Đảm bảo tiến độ công việc',
            approver: '100120',
            status: 'Đã duyệt'
          });

          const [processedRows, setProcessedRows] = useState([]);
          const [employeeSummaries, setEmployeeSummaries] = useState({});
          const [loading, setLoading] = useState(false);
          const [activeTab, setActiveTab] = useState('preview');
          const [fileName, setFileName] = useState('');
          const [errorMsg, setErrorMsg] = useState('');

          useEffect(() => {
            if (window.XLSX) {
              setXlsxLoaded(true);
            } else {
              setErrorMsg('Không thể tải thư viện xử lý Excel. Vui lòng kiểm tra lại kết nối mạng.');
            }
            if (window.lucide) {
              window.lucide.createIcons();
            }
          }, []);

          useEffect(() => {
            if (window.lucide) {
              window.lucide.createIcons();
            }
          }, [activeTab, processedRows, xlsxLoaded]);

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!window.XLSX) {
              setErrorMsg('Thư viện Excel chưa sẵn sàng.');
              return;
            }
            setFileName(file.name);
            setErrorMsg('');
            setLoading(true);

            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = window.XLSX.read(bstr, { type: 'binary', cellDates: true });
                setRawWorkbook(wb);
                setRawSheets(wb.SheetNames);
                if (wb.SheetNames.length > 0) {
                  setSelectedSheet(wb.SheetNames[0]);
                  parseSheet(wb, wb.SheetNames[0]);
                }
              } catch (err) {
                setErrorMsg('Lỗi đọc file Excel: ' + err.message);
                setLoading(false);
              }
            };
            reader.readAsBinaryString(file);
          };

          const handleSheetChange = (sheetName) => {
            setSelectedSheet(sheetName);
            if (rawWorkbook) {
              parseSheet(rawWorkbook, sheetName);
            }
          };

          const parseSheet = (wb, sheetName) => {
            setLoading(true);
            try {
              const ws = wb.Sheets[sheetName];
              const data = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
              setRawData(data);
              processOvertimeData(data);
            } catch (err) {
              setErrorMsg('Lỗi phân tích sheet: ' + err.message);
            } finally {
              setLoading(false);
            }
          };

          const pad = (n) => (n < 10 ? '0' + n : n);

          const formatDateDDMMYYYY = (dateObj) => {
            const d = pad(dateObj.getDate());
            const m = pad(dateObj.getMonth() + 1);
            const y = dateObj.getFullYear();
            return `${d}/${m}/${y}`;
          };

          const getDayOfWeekName = (dayNum) => {
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            return days[dayNum];
          };

          const processOvertimeData = (data) => {
            if (!data || data.length === 0) return;

            const startIdx = settings.startRow - 1;
            const results = [];
            const summaries = {};
            const baseDateObj = new Date(settings.periodStartDate);

            for (let r = startIdx; r < data.length; r++) {
              const row = data[r];
              if (!row) continue;

              const empId = row[settings.empIdCol] !== undefined ? String(row[settings.empIdCol]).trim() : '';
              const empName = row[settings.empNameCol] !== undefined ? String(row[settings.empNameCol]).trim() : '';
              const positionTitle = row[settings.titleCol] !== undefined ? String(row[settings.titleCol]).trim() : '';

              if (!empId) continue;

              if (!summaries[empId]) {
                summaries[empId] = {
                  empId,
                  empName,
                  positionTitle,
                  weekdayHours: 0,
                  sundayHours: 0,
                  totalHours: 0
                };
              }

              for (let c = settings.otStartCol; c <= settings.otEndCol; c++) {
                const cellValue = row[c];
                const otHours = parseFloat(cellValue);

                if (!isNaN(otHours) && otHours > 0) {
                  const dayOffset = c - settings.otStartCol;
                  const currentDate = new Date(baseDateObj);
                  currentDate.setDate(baseDateObj.getDate() + dayOffset);

                  const dayOfWeek = currentDate.getDay();
                  if (dayOfWeek === 0) {
                    summaries[empId].sundayHours += otHours;
                  } else {
                    summaries[empId].weekdayHours += otHours;
                  }
                  summaries[empId].totalHours += otHours;

                  const workDateFormatted = formatDateDDMMYYYY(currentDate);

                  results.push({
                    empId,
                    empName,
                    workDate: workDateFormatted,
                    shiftName: '', // Ca làm việc: trống
                    paidStandardWorkDays: '', // Số công hưởng lương: trống
                    actualWorkDays: '', // Số công đi làm thực tế: trống
                    otHours: otHours, // Làm thêm hưởng lương(00:00 - 23:59)
                    dayOfWeek: getDayOfWeekName(dayOfWeek) // Thứ trong tuần
                  });
                }
              }
            }

            setProcessedRows(results);
            setEmployeeSummaries(summaries);
          };

          useEffect(() => {
            if (rawData.length > 0) {
              processOvertimeData(rawData);
            }
          }, [settings]);

          const exportToExcel = () => {
            if (processedRows.length === 0 || !window.XLSX) return;

            // Xuất đúng mẫu cấu trúc mới
            const exportData = processedRows.map((item) => ({
              'Mã nhân viên': item.empId,
              'Tên nhân viên': item.empName,
              'Ngày làm việc': item.workDate,
              'Ca làm việc': item.shiftName,
              'Số công hưởng lương': item.paidStandardWorkDays,
              'Số công đi làm thực tế': item.actualWorkDays,
              'Làm thêm hưởng lương(00:00 - 23:59)': item.otHours,
              'Thứ trong tuần': item.dayOfWeek
            }));

            const worksheet = window.XLSX.utils.json_to_sheet(exportData);
            const workbook = window.XLSX.utils.book_new();
            window.XLSX.utils.book_append_sheet(workbook, worksheet, 'OT_HR_AMIS');

            const originalBaseName = fileName ? fileName.replace(/\.[^/.]+$/, '') : 'OT_KetQua';
            const exportFileName = `${originalBaseName}_OTAmis.xlsx`;

            window.XLSX.writeFile(workbook, exportFileName);
          };

          return (
            <div className="flex flex-col min-h-screen">
              <header className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
                <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                      <i data-lucide="file-spreadsheet" className="w-7 h-7 text-emerald-400"></i>
                    </div>
                    <div>
                      <h1 className="text-xl font-bold tracking-tight">Hệ Thống Chuyển Đổi OT Misa</h1>
                      <p className="text-xs text-blue-200">Định dạng bảng chuẩn theo cột tùy chỉnh mới</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-2 bg-white/10 p-1.5 rounded-xl backdrop-blur-sm border border-white/10">
                    <button 
                      onClick={() => setActiveTab('preview')}
                      className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${activeTab === 'preview' ? 'bg-white text-blue-900 shadow-sm' : 'text-white hover:bg-white/10'}`}
                    >
                      <i data-lucide="eye" className="w-4 h-4"></i> Kết quả ({processedRows.length})
                    </button>
                    <button 
                      onClick={() => setActiveTab('summary')}
                      className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${activeTab === 'summary' ? 'bg-white text-blue-900 shadow-sm' : 'text-white hover:bg-white/10'}`}
                    >
                      <i data-lucide="bar-chart-2" className="w-4 h-4"></i> Tổng hợp NV
                    </button>
                    <button 
                      onClick={() => setActiveTab('settings')}
                      className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${activeTab === 'settings' ? 'bg-white text-blue-900 shadow-sm' : 'text-white hover:bg-white/10'}`}
                    >
                      <i data-lucide="settings" className="w-4 h-4"></i> Cấu hình
                    </button>
                  </div>
                </div>
              </header>

              <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                  <div className="md:col-span-1 flex flex-col gap-2">
                    <label className="text-sm font-semibold text-slate-700 flex items-center gap-2">
                      <i data-lucide="upload" className="w-4 h-4 text-blue-600"></i> Tải lên file Excel chấm công OT
                    </label>
                    <div className="relative border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-blue-500 transition-colors bg-slate-50/50 group cursor-pointer">
                      <input 
                        type="file" 
                        accept=".xlsx, .xls" 
                        onChange={handleFileUpload} 
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                      />
                      <div className="flex flex-col items-center gap-1">
                        <i data-lucide="file-spreadsheet" className="w-8 h-8 text-slate-400 group-hover:text-blue-600 transition-colors"></i>
                        <span className="text-xs font-medium text-slate-600">
                          {fileName ? <strong className="text-blue-600">{fileName}</strong> : "Chọn file hoặc kéo thả vào đây"}
                        </span>
                        <span className="text-[10px] text-slate-400">Hỗ trợ .xlsx, .xls</span>
                      </div>
                    </div>
                  </div>

                  <div className="md:col-span-2 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="flex flex-col gap-1 w-full sm:w-auto">
                      <span className="text-xs font-medium text-slate-500">Chọn Sheet dữ liệu:</span>
                      <select 
                        value={selectedSheet} 
                        onChange={(e) => handleSheetChange(e.target.value)}
                        disabled={rawSheets.length === 0}
                        className="bg-white border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 min-w-[200px]"
                      >
                        {rawSheets.length === 0 ? (
                          <option>Chưa có file dữ liệu</option>
                        ) : (
                          rawSheets.map(s => <option key={s} value={s}>{s}</option>)
                        )}
                      </select>
                    </div>

                    <div className="flex items-center gap-3 w-full sm:w-auto justify-end">
                      <div className="text-right hidden sm:block">
                        <div className="text-xs text-slate-500">Tổng số bản ghi OT:</div>
                        <div className="text-lg font-bold text-blue-600">{processedRows.length}</div>
                      </div>
                      <button 
                        onClick={exportToExcel}
                        disabled={processedRows.length === 0}
                        className={`w-full sm:w-auto px-5 py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow-sm transition-all ${processedRows.length > 0 ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-200' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                      >
                        <i data-lucide="download" className="w-4 h-4"></i> Tải Excel Misa
                      </button>
                    </div>
                  </div>
                </div>

                {errorMsg && (
                  <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm flex items-center gap-3">
                    <i data-lucide="alert-triangle" className="w-5 h-5 text-red-500 shrink-0"></i>
                    <span>{errorMsg}</span>
                  </div>
                )}

                {}
                {activeTab === 'preview' && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
                    <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <i data-lucide="file-spreadsheet" className="w-5 h-5 text-blue-600"></i>
                        <h2 className="font-semibold text-slate-800">Kết quả xuất Excel (Theo thứ tự cột mới)</h2>
                      </div>
                      <span className="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-medium">
                        {processedRows.length} dòng
                      </span>
                    </div>

                    <div className="overflow-x-auto min-h-[400px]">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100/70 text-slate-600 font-semibold uppercase tracking-wider border-b border-slate-200">
                            <th className="py-3 px-3">STT</th>
                            <th className="py-3 px-3">1. Mã nhân viên</th>
                            <th className="py-3 px-3">2. Tên nhân viên</th>
                            <th className="py-3 px-3 bg-blue-50 text-blue-900 font-bold">3. Ngày làm việc (DD/MM/YYYY)</th>
                            <th className="py-3 px-3 text-slate-400">4. Ca làm việc</th>
                            <th className="py-3 px-3 text-slate-400">5. Số công hưởng lương</th>
                            <th className="py-3 px-3 text-slate-400">6. Số công đi làm thực tế</th>
                            <th className="py-3 px-3 bg-emerald-50 text-emerald-900 font-bold text-center">7. Làm thêm hưởng lương(00:00 - 23:59)</th>
                            <th className="py-3 px-3 bg-amber-50 text-amber-900 font-bold">8. Thứ trong tuần</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-slate-700">
                          {processedRows.length === 0 ? (
                            <tr>
                              <td colSpan="9" className="text-center py-16 text-slate-400">
                                <div className="flex flex-col items-center justify-center gap-2">
                                  <i data-lucide="file-spreadsheet" className="w-12 h-12 text-slate-300"></i>
                                  <p>Chưa có dữ liệu. Vui lòng tải lên file Excel chấm công OT.</p>
                                </div>
                              </td>
                            </tr>
                          ) : (
                            processedRows.map((row, idx) => (
                              <tr key={idx} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-2.5 px-3 text-slate-400 font-medium">{idx + 1}</td>
                                <td className="py-2.5 px-3 font-semibold text-blue-600">{row.empId}</td>
                                <td className="py-2.5 px-3 font-medium">{row.empName || '(Không có tên)'}</td>
                                <td className="py-2.5 px-3 bg-blue-50/50 font-semibold text-blue-800">{row.workDate}</td>
                                <td className="py-2.5 px-3 text-slate-300 italic">{row.shiftName || '(Trống)'}</td>
                                <td className="py-2.5 px-3 text-slate-300 italic">{row.paidStandardWorkDays || '(Trống)'}</td>
                                <td className="py-2.5 px-3 text-slate-300 italic">{row.actualWorkDays || '(Trống)'}</td>
                                <td className="py-2.5 px-3 bg-emerald-50/50 text-center"><span className="text-emerald-800 font-bold bg-emerald-100/70 px-2.5 py-0.5 rounded-md">{row.otHours}</span></td>
                                <td className="py-2.5 px-3 bg-amber-50/50"><span className="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-md font-medium">{row.dayOfWeek}</span></td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {activeTab === 'summary' && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
                    <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <i data-lucide="bar-chart-2" className="w-5 h-5 text-blue-600"></i>
                        <h2 className="font-semibold text-slate-800">Bảng Tổng Hợp Giờ OT Theo Nhân Viên (Ngày Thường & Chủ Nhật)</h2>
                      </div>
                      <span className="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-medium">
                        {Object.keys(employeeSummaries).length} nhân viên
                      </span>
                    </div>

                    <div className="overflow-x-auto min-h-[400px]">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100/70 text-slate-600 font-semibold uppercase tracking-wider border-b border-slate-200">
                            <th className="py-3 px-4">STT</th>
                            <th className="py-3 px-4">Mã nhân viên</th>
                            <th className="py-3 px-4">Tên nhân viên</th>
                            <th className="py-3 px-4">Chức vụ / Ghi chú</th>
                            <th className="py-3 px-4 text-right">Tổng giờ ngày thường (T2-T7)</th>
                            <th className="py-3 px-4 text-right">Tổng giờ Chủ Nhật</th>
                            <th className="py-3 px-4 text-right font-bold text-blue-600">Tổng cộng giờ OT</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-slate-700">
                          {Object.keys(employeeSummaries).length === 0 ? (
                            <tr>
                              <td colSpan="7" className="text-center py-16 text-slate-400">
                                <div className="flex flex-col items-center justify-center gap-2">
                                  <i data-lucide="bar-chart-2" className="w-12 h-12 text-slate-300"></i>
                                  <p>Chưa có dữ liệu tổng hợp. Vui lòng tải lên file Excel.</p>
                                </div>
                              </td>
                            </tr>
                          ) : (
                            Object.values(employeeSummaries).map((sum, idx) => (
                              <tr key={sum.empId} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-3 px-4 text-slate-400 font-medium">{idx + 1}</td>
                                <td className="py-3 px-4 font-semibold text-blue-600">{sum.empId}</td>
                                <td className="py-3 px-4 font-medium">{sum.empName || '(Không có tên)'}</td>
                                <td className="py-3 px-4 text-slate-500 italic">{sum.positionTitle}</td>
                                <td className="py-3 px-4 text-right font-mono"><span className="bg-blue-50 text-blue-800 px-2 py-1 rounded font-semibold">{sum.weekdayHours.toFixed(1)}h</span></td>
                                <td className="py-3 px-4 text-right font-mono"><span className="bg-amber-50 text-amber-800 px-2 py-1 rounded font-semibold">{sum.sundayHours.toFixed(1)}h</span></td>
                                <td className="py-3 px-4 text-right font-mono font-bold text-emerald-600 text-sm">{sum.totalHours.toFixed(1)}h</td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {activeTab === 'settings' && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col gap-6">
                    <div className="flex items-center gap-2 border-b border-slate-100 pb-4">
                      <i data-lucide="settings" className="w-5 h-5 text-blue-600"></i>
                      <div>
                        <h2 className="font-semibold text-slate-800">Cấu hình tham số đọc file & thiết lập mặc định</h2>
                        <p className="text-xs text-slate-500">Tùy chỉnh thông số kỳ lương, dòng đọc dữ liệu, cột bắt đầu/kết thúc...</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs font-semibold text-slate-700">Dòng bắt đầu dữ liệu (Start Row):</label>
                        <input 
                          type="number" 
                          value={settings.startRow}
                          onChange={(e) => setSettings({...settings, startRow: parseInt(e.target.value) || 1})}
                          className="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs font-semibold text-slate-700">Cột Mã nhân viên (Index):</label>
                        <input 
                          type="number" 
                          value={settings.empIdCol}
                          onChange={(e) => setSettings({...settings, empIdCol: parseInt(e.target.value) || 0})}
                          className="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs font-semibold text-slate-700">Cột Tên nhân viên (Index):</label>
                        <input 
                          type="number" 
                          value={settings.empNameCol}
                          onChange={(e) => setSettings({...settings, empNameCol: parseInt(e.target.value) || 0})}
                          className="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs font-semibold text-slate-700">Cột Chức vụ / Ghi chú (Index):</label>
                        <input 
                          type="number" 
                          value={settings.titleCol}
                          onChange={(e) => setSettings({...settings, titleCol: parseInt(e.target.value) || 0})}
                          className="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs font-semibold text-slate-700">Cột bắt đầu ngày OT (Cột E):</label>
                        <input 
                          type="number" 
                          value={settings.otStartCol}
                          onChange={(e) => setSettings({...settings, otStartCol: parseInt(e.target.value) || 0})}
                          className="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs font-semibold text-slate-700">Cột kết thúc ngày OT (Cột AI):</label>
                        <input 
                          type="number" 
                          value={settings.otEndCol}
                          onChange={(e) => setSettings({...settings, otEndCol: parseInt(e.target.value) || 0})}
                          className="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>

                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs font-semibold text-slate-700">Ngày bắt đầu kỳ chấm công:</label>
                        <input 
                          type="date" 
                          value={settings.periodStartDate}
                          onChange={(e) => setSettings({...settings, periodStartDate: e.target.value})}
                          className="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm"
                        />
                      </div>
                    </div>
                  </div>
                )}
              </main>

              <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-auto">
                Ứng dụng chuyển đổi bảng chấm công OT Misa &bull; Xuất chuẩn theo định dạng cột tùy chỉnh
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
